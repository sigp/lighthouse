[package]
name = "execution_layer"
version = "0.1.0"
edition = { workspace = true }
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
alloy-consensus = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
arc-swap = "1.9.2"
bls = { workspace = true }
builder_client = { workspace = true }
bytes = { workspace = true }
eth2 = { workspace = true, features = ["events", "lighthouse", "network"] }
ethereum_serde_utils = { workspace = true }
ethereum_ssz = { workspace = true }
fixed_bytes = { workspace = true }
fork_choice = { workspace = true }
# MUST match `triehash`'s own `hash-db ^0.15.2`. triehash 0.8.4 (latest, 2021)
# is pinned to the 0.15 series, and one type cannot implement two versions of
# `hash_db::Hasher`. `cargo upgrade` will otherwise bump this and fail the build
# with `the trait bound KeccakHasher: hash_db::Hasher is not satisfied`.
hash-db = "0.15.2"
hash256-std-hasher = "0.15.2"
hashlink = { workspace = true }
hex = { workspace = true }
jsonwebtoken = "11"
keccak-hash = "0.12.0"
kzg = { workspace = true }
lighthouse_version = { workspace = true }
logging = { workspace = true }
metrics = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }
parking_lot = { workspace = true }
pretty_reqwest_error = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sensitive_url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
slot_clock = { workspace = true }
ssz_types = { workspace = true }
state_processing = { workspace = true }
strum = { workspace = true }
superstruct = { workspace = true }
task_executor = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tree_hash = { workspace = true }
tree_hash_derive = { workspace = true }
triehash = "0.8.4"
typenum = { workspace = true }
types = { workspace = true }
warp = { workspace = true }
zeroize = { workspace = true }

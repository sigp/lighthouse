[package]
name = "store"
version = "0.2.0"
authors = ["Paul Hauner <paul@paulhauner.com>"]
edition = { workspace = true }

[features]
default = ["leveldb"]
leveldb = ["dep:leveldb"]
redb = ["dep:redb"]

[dependencies]
bls = { workspace = true }
# MUST match `leveldb`'s own `db-key ^0.0.5`. leveldb 0.8.6 (latest, 2020) can
# only ever use the 0.0.x trait, and one type cannot implement two versions of
# `db_key::Key`. `cargo upgrade` will otherwise bump this and fail the build with
# `the trait bound BytesKey: db_key::Key is not satisfied`.
db-key = "~0.0.5"
directory = { workspace = true }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
fixed_bytes = { workspace = true }
hashlink = { workspace = true }
itertools = { workspace = true }
leveldb = { version = "0.8.6", optional = true, default-features = false }
logging = { workspace = true }
metrics = { workspace = true }
milhouse = { workspace = true }
parking_lot = { workspace = true }
redb = { version = "4.3.0", optional = true }
safe_arith = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
ssz_types = { workspace = true }
state_processing = { workspace = true }
strum = { workspace = true }
superstruct = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
typenum = { workspace = true }
types = { workspace = true }
xdelta3 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
beacon_chain = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "hdiff"
harness = false

# Kurtosis config file for testing sync on a local devnet.
participants:
  - cl_type: lighthouse
    cl_image: lighthouse:local
    supernode: true
    count: 2
  # nodes without validators, used for testing sync.
  - cl_type: lighthouse
    cl_image: lighthouse:local
    supernode: true
    validator_count: 0
  - cl_type: lighthouse
    cl_image: lighthouse:local
    supernode: false
    validator_count: 0
network_params:
  gloas_fork_epoch: 0
  slot_duration_ms: 6000
  preset: "minimal"
# TODO: Update this once devnet-7 changes are merged.
ethereum_genesis_generator_params:
    image: ethpandaops/ethereum-genesis-generator:6.1.2
additional_services:
  - tx_fuzz
  - spamoor
global_log_level: debug

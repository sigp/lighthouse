name: slashing-protection-proofs

# Only runs when the verified function or the proofs themselves change. Everything here
# needs Lean, mathlib, OCaml and a pinned rustc nightly, which is far too heavy to put in
# front of every PR -- and a failure here should point at whoever edited `attestation_rules.rs`,
# not at an unrelated contributor.
on:
  push:
    paths:
      - 'validator_client/slashing_protection/src/attestation_rules.rs'
      - 'validator_client/slashing_protection/proofs/**'
      - '.github/workflows/slashing-proofs.yml'
  pull_request:
    paths:
      - 'validator_client/slashing_protection/src/attestation_rules.rs'
      - 'validator_client/slashing_protection/proofs/**'
      - '.github/workflows/slashing-proofs.yml'
  workflow_dispatch:

env:
  # Must stay in sync with proofs/lakefile.lean and proofs/README.md.
  CHARON_REV: fea3fc68d445181cf4ce094855a43a17192a2b12
  AENEAS_REV: 453b09f98f2b593c0544a8ad654b77e2a3bc621a

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache mathlib build
        uses: actions/cache@v4
        with:
          path: validator_client/slashing_protection/proofs/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('validator_client/slashing_protection/proofs/lakefile.lean', 'validator_client/slashing_protection/proofs/lean-toolchain') }}

      - name: Build the proofs
        working-directory: validator_client/slashing_protection/proofs
        run: |
          lake exe cache get
          lake build

      - name: Fail on sorry
        working-directory: validator_client/slashing_protection/proofs
        run: |
          if grep -rn 'sorry' SlashingProofs/; then
            echo "::error::a proof depends on sorry"
            exit 1
          fi

      # Everything below re-derives Generated.lean from attestation_rules.rs and checks it did not
      # drift. This is what makes the proof a statement about the current source rather than
      # about a stale snapshot.
      - name: Cache charon/aeneas builds
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/verif/charon/charon/target/release/charon
            ~/verif/charon/charon/target/release/charon-driver
            ~/verif/aeneas/src/_build/default/main.exe
          key: verif-tools-${{ runner.os }}-${{ env.CHARON_REV }}-${{ env.AENEAS_REV }}

      - name: Build Charon and Aeneas
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/verif && cd ~/verif
          git clone https://github.com/AeneasVerif/charon
          git -C charon checkout "$CHARON_REV"
          (cd charon/charon && cargo build --release)
          git clone https://github.com/AeneasVerif/aeneas
          git -C aeneas checkout "$AENEAS_REV"
          ln -sfn ~/verif/charon ~/verif/aeneas/charon
          # ubuntu-latest ships neither opam nor OCaml.
          sudo apt-get update -qq && sudo apt-get install -y -qq opam
          # domainslib requires OCaml >= 5.0
          opam init -y --bare --disable-sandboxing
          opam switch create aeneas 5.2.0 -y
          # Take the dependency list from Aeneas itself so it cannot drift from the pinned rev.
          (cd ~/verif/aeneas/src && opam install -y --switch=aeneas --assume-depexts --deps-only \
            ./aeneas.opam ./aeneas.ppx.opam)
          (cd ~/verif/aeneas/src && opam exec --switch=aeneas -- dune build)

      - name: Regenerate and diff
        working-directory: validator_client/slashing_protection
        run: |
          export PATH="$HOME/verif/charon/charon/target/release:$PATH"
          # `-- --lib` is required: without it Charon translates src/bin/test_generator.rs
          # and silently emits opaque bodies.
          charon cargo --preset=aeneas \
            --start-from 'slashing_protection::attestation_rules::check_attestation' \
            --dest-file pure.llbc -- --lib
          ~/verif/aeneas/src/_build/default/main.exe -backend lean pure.llbc -dest /tmp/regen
          # The generated file is namespaced/renamed on the way in; compare the definitions.
          diff <(sed -n '/^namespace/,$p' /tmp/regen/Pure.lean) \
               <(sed -n '/^namespace/,$p' proofs/SlashingProofs/Generated.lean) \
            || { echo "::error::Generated.lean is stale -- regenerate it (see proofs/README.md)"; exit 1; }

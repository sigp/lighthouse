name: docker

on:
    push:
        branches:
            - unstable
        tags:
            - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
    DOCKER_PASSWORD: ${{ secrets.DH_KEY }}
    DOCKER_USERNAME: ${{ secrets.DH_ORG }}

jobs:
    # Extract the VERSION which is either `latest` or `vX.Y.Z`, and the VERSION_SUFFIX
    # which is either empty or `-unstable`.
    #
    # It would be nice if the arch didn't get spliced into the version between `latest` and
    # `unstable`, but for now we keep the two parts of the version separate for backwards
    # compatibility.
    extract-version:
        runs-on: ubuntu-24.04
        steps:
            - name: Extract version (if unstable)
              if: github.event.ref == 'refs/heads/unstable'
              run: |
                    echo "VERSION=latest" >> $GITHUB_ENV
                    echo "VERSION_SUFFIX=-unstable" >> $GITHUB_ENV
            - name: Extract version (if tagged release)
              if: startsWith(github.event.ref, 'refs/tags')
              run: |
                    echo "VERSION=$(echo ${GITHUB_REF#refs/tags/})" >> $GITHUB_ENV
                    echo "VERSION_SUFFIX=" >> $GITHUB_ENV
        outputs:
            VERSION: ${{ env.VERSION }}
            VERSION_SUFFIX: ${{ env.VERSION_SUFFIX }}
    build-docker-single-arch:
        name: build-docker-${{ matrix.binary }}-${{ matrix.cpu_arch }}${{ matrix.features.version_suffix }}
        # Each architecture builds natively. Releases use paid GitHub-hosted larger runners, configured
        # via the `RELEASE_RUNNER` (x64) and `RELEASE_RUNNER_ARM64` repository variables. Everything
        # else (and forks) uses free GitHub-hosted runners.
        runs-on: ${{ matrix.cpu_arch == 'aarch64' && (startsWith(github.ref, 'refs/tags/') && vars.RELEASE_RUNNER_ARM64 || 'ubuntu-24.04-arm') || (startsWith(github.ref, 'refs/tags/') && vars.RELEASE_RUNNER || 'ubuntu-24.04') }}
        strategy:
            matrix:
                binary:   [lighthouse,
                           lcli]
                cpu_arch: [aarch64,
                           x86_64]

        needs: [extract-version]
        env:
            VERSION: ${{ needs.extract-version.outputs.VERSION }}
            VERSION_SUFFIX: ${{ needs.extract-version.outputs.VERSION_SUFFIX }}
            # Releases use `maxperf` (fat LTO), which needs ~16 GB to build. Unstable images use
            # `release` so they build reliably on free runners.
            PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'maxperf' || 'release' }}
        steps:
            - uses: actions/checkout@v7
            - name: Dockerhub login
              run: |
                  echo "${DOCKER_PASSWORD}" | docker login --username ${DOCKER_USERNAME} --password-stdin

            - name: Build binary
              run: |
                  if [ "${{ matrix.binary }}" = lighthouse ]; then
                    features=gnosis,spec-minimal,slasher-lmdb,jemalloc
                  fi
                  scripts/ci/build-linux.sh ${{ matrix.binary }} ${{ env.PROFILE }} "${features:-}"

            - name: Make bin dir
              run: mkdir ./bin

            - name: Move binary into Docker scope
              run: mv ./target/${{ matrix.cpu_arch }}-unknown-linux-gnu/${{ env.PROFILE }}/${{ matrix.binary }} ./bin

            - name: Map aarch64 to arm64 short arch
              if: startsWith(matrix.cpu_arch, 'aarch64')
              run: echo "SHORT_ARCH=arm64" >> $GITHUB_ENV

            - name: Map x86_64 to amd64 short arch
              if: startsWith(matrix.cpu_arch, 'x86_64')
              run: echo "SHORT_ARCH=amd64" >> $GITHUB_ENV;

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build and push (Lighthouse)
              if: startsWith(matrix.binary, 'lighthouse')
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                file: ./Dockerfile.cross
                context: .
                platforms: linux/${{ env.SHORT_ARCH }}
                push: true
                tags: |
                  ${{ github.repository_owner}}/${{ matrix.binary }}:${{ env.VERSION }}-${{ env.SHORT_ARCH }}${{ env.VERSION_SUFFIX }}

            - name: Build and push (lcli)
              if: startsWith(matrix.binary, 'lcli')
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                file: ./lcli/Dockerfile.cross
                context: .
                platforms: linux/${{ env.SHORT_ARCH }}
                push: true

                tags: |
                  ${{ github.repository_owner}}/${{ matrix.binary }}:${{ env.VERSION }}-${{ env.SHORT_ARCH }}${{ env.VERSION_SUFFIX }}


    build-docker-multiarch:
        name: build-docker-${{ matrix.binary }}-multiarch
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                binary: [lighthouse,
                         lcli]
        needs: [build-docker-single-arch, extract-version]
        env:
            VERSION: ${{ needs.extract-version.outputs.VERSION }}
            VERSION_SUFFIX: ${{ needs.extract-version.outputs.VERSION_SUFFIX }}
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Dockerhub login
              run: |
                  echo "${DOCKER_PASSWORD}" | docker login --username ${DOCKER_USERNAME} --password-stdin

            - name: Create and push multiarch manifests
              run: |
                  # Create the main tag (versioned for releases, latest-unstable for unstable)
                  docker buildx imagetools create -t ${{ github.repository_owner}}/${{ matrix.binary }}:${VERSION}${VERSION_SUFFIX} \
                      ${{ github.repository_owner}}/${{ matrix.binary }}:${VERSION}-arm64${VERSION_SUFFIX} \
                      ${{ github.repository_owner}}/${{ matrix.binary }}:${VERSION}-amd64${VERSION_SUFFIX};

                  # For version tags, also create/update the latest tag to keep stable up to date
                  # Only create latest tag for proper release versions (e.g. v1.2.3, not v1.2.3-alpha)
                  if [[ "${GITHUB_REF}" == refs/tags/* ]] && [[ "${VERSION}" =~ ^v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
                    docker buildx imagetools create -t ${{ github.repository_owner}}/${{ matrix.binary }}:latest \
                        ${{ github.repository_owner}}/${{ matrix.binary }}:${VERSION}-arm64${VERSION_SUFFIX} \
                        ${{ github.repository_owner}}/${{ matrix.binary }}:${VERSION}-amd64${VERSION_SUFFIX};
                  fi


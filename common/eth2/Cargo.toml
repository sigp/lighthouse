[package]
name = "eth2"
version = "0.1.0"
authors = ["Paul Hauner <paul@paulhauner.com>"]
edition = { workspace = true }

[features]
default = []
lighthouse = ["proto_array", "eth2_keystore", "eip_3076", "zeroize"]
events = ["sse-reqwest-client", "futures", "futures-util"]
network = ["libp2p-identity", "enr", "multiaddr"]

[dependencies]
bls = { workspace = true }
builder_types = { workspace = true }
context_deserialize = { workspace = true }
educe = { workspace = true }
eip_3076 = { workspace = true, optional = true }
enr = { workspace = true, features = ["ed25519"], optional = true }
eth2_keystore = { workspace = true, optional = true }
ethereum_serde_utils = { workspace = true }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
fork_choice = { workspace = true }
futures = { workspace = true, optional = true }
futures-util = { version = "0.3.34", optional = true }
libp2p-identity = { version = "0.3", features = ["peerid"], optional = true }
mediatype = "0.23.0"
multiaddr = { version = "0.19.0", optional = true }
pretty_reqwest_error = { workspace = true }
proto_array = { workspace = true, optional = true }
reqwest = { workspace = true }
sensitive_url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sse-reqwest-client = { version = "0.4", optional = true }
ssz_types = { workspace = true }
superstruct = { workspace = true }
types = { workspace = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
arbitrary = { workspace = true }
builder_types = { workspace = true, features = ["arbitrary"] }
tokio = { workspace = true }
types = { workspace = true, features = ["arbitrary"] }
